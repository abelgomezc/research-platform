server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El frontend llama al backend por /api; en desarrollo se hace proxy,
    # lo que evita depender de CORS.
    location /api/ {
        # 8081 es el puerto interno del backend. El 8080 lo ocupa LocalRAG.
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # El stream SSE de eventos no debe bufferedizarse.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /actuator/ {
        proxy_pass http://backend:8081;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
