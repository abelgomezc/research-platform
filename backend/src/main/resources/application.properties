# =====================================================================
# AI Research & Intelligence Platform - configuracion base
# Perfil por defecto: desarrollo local con Docker Compose.
# Todos los secretos vienen de variables de entorno. No hay secretos aqui.
# =====================================================================

spring.application.name=research-platform
# Puerto 8081: el 8080 lo ocupa LocalRAG para poder convivir con el.
server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------------
# Base de datos: PostgreSQL 16 + pgvector
# ---------------------------------------------------------------------
# 5433 en el host: el 5432 lo ocupa el PostgreSQL de LocalRAG. Dentro de la red
# de Docker el backend usa postgres:5432, que le pasa DB_URL por variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/research_platform}
spring.datasource.username=${DB_USER:research}
spring.datasource.password=${DB_PASSWORD:research}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=research-pool

# ---------------------------------------------------------------------
# Pool de solo lectura para la tool query_database.
# El usuario research_ro solo tiene GRANT SELECT: aunque el validador de
# SQL tuviera un hueco, la base de datos rechazaria la escritura.
# research_ro lo crea la migracion V2__dataset_demo.sql.
# ---------------------------------------------------------------------
app.read-only-datasource.url=${DB_RO_URL:${DB_URL:jdbc:postgresql://localhost:5433/research_platform}}
app.read-only-datasource.username=${DB_RO_USER:research_ro}
app.read-only-datasource.password=${DB_RO_PASSWORD:solo_lectura_demo}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------
# Migraciones
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------
# Proveedor de modelos: Ollama local
# ---------------------------------------------------------------------
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=${OLLAMA_PULL_STRATEGY:never}
spring.ai.ollama.init.timeout=10m
spring.ai.ollama.chat.options.num-ctx=8192

# ---------------------------------------------------------------------
# Modelos por rol de agente.
# Cambiar de modelo es cambiar estas propiedades, nunca codigo.
# ---------------------------------------------------------------------
app.llm.models.planner=${LLM_MODEL_PLANNER:qwen3:8b}
app.llm.models.researcher=${LLM_MODEL_RESEARCHER:qwen3:8b}
app.llm.models.verifier=${LLM_MODEL_VERIFIER:qwen3:8b}
app.llm.models.synthesizer=${LLM_MODEL_SYNTHESIZER:qwen3:8b}
app.llm.models.reviewer=${LLM_MODEL_REVIEWER:qwen3:8b}
app.llm.models.evaluator=${LLM_MODEL_EVALUATOR:qwen3:8b}
app.llm.embedding-model=${LLM_EMBEDDING_MODEL:nomic-embed-text}

app.llm.retry.max-attempts=${LLM_RETRY_MAX_ATTEMPTS:3}
app.llm.retry.initial-backoff=${LLM_RETRY_INITIAL_BACKOFF:2s}
app.llm.retry.multiplier=2.0
app.llm.retry.max-backoff=${LLM_RETRY_MAX_BACKOFF:30s}

app.llm.params.planner.temperature=0.2
app.llm.params.planner.max-tokens=4096
app.llm.params.researcher.temperature=0.3
app.llm.params.researcher.max-tokens=4096
app.llm.params.verifier.temperature=0.1
app.llm.params.verifier.max-tokens=2048
app.llm.params.synthesizer.temperature=0.3
app.llm.params.synthesizer.max-tokens=8192
app.llm.params.reviewer.temperature=0.1
app.llm.params.reviewer.max-tokens=4096
app.llm.params.evaluator.temperature=0.0
app.llm.params.evaluator.max-tokens=2048

# ---------------------------------------------------------------------
# Metabuscador local SearXNG (sin API keys)
# ---------------------------------------------------------------------
app.search.base-url=${SEARXNG_URL:http://localhost:8090}
app.search.timeout=${SEARXNG_TIMEOUT:15s}
app.search.max-results=${SEARXNG_MAX_RESULTS:8}

# ---------------------------------------------------------------------
# CORS: solo el frontend declarado
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# ---------------------------------------------------------------------
# Proteccion simple del API por token (opcional)
# Si API_TOKEN queda vacio, el API queda abierto en desarrollo.
# ---------------------------------------------------------------------
app.security.api-token=${API_TOKEN:}

# ---------------------------------------------------------------------
# Conocimiento interno: puerto con dos implementaciones intercambiables.
# El agente no sabe cual esta activa.
#   pgvector  = busqueda semantica simple, incluida en este repositorio
#   localrag  = adaptador HTTP a un LocalRAG externo
# ---------------------------------------------------------------------
app.knowledge.provider=${KNOWLEDGE_PROVIDER:pgvector}

app.knowledge.pgvector.embedding-dimensions=${EMBEDDING_DIMENSIONS:768}
app.knowledge.pgvector.chunk-size=${CHUNK_SIZE:800}
app.knowledge.pgvector.chunk-overlap=${CHUNK_OVERLAP:120}
app.knowledge.pgvector.default-top-k=${DEFAULT_TOP_K:5}

# Adaptador LocalRAG. El endpoint de busqueda todavia no existe en LocalRAG,
# por lo que este adaptador falla de forma controlada. Ver README.
app.knowledge.localrag.base-url=${LOCALRAG_URL:http://localhost:8080}
app.knowledge.localrag.search-path=${LOCALRAG_SEARCH_PATH:/api/search}
app.knowledge.localrag.timeout=${LOCALRAG_TIMEOUT:15s}
app.knowledge.localrag.enabled-check=${LOCALRAG_ENABLED_CHECK:false}

# ---------------------------------------------------------------------
# Observabilidad
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [investigacionId=%X{investigacionId:-}] [agente=%X{agente:-}]
logging.level.com.abegomez.research=${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------
# OpenAPI
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------------------------------------------------------------
# Hilos virtuales para tareas de investigacion en paralelo
# ---------------------------------------------------------------------
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------
# Orquestacion de investigaciones
# ---------------------------------------------------------------------
# Margen que no se cruza al decidir si cabe otra llamada al modelo. Evita que
# una llamada iniciada con poco presupuesto la deje en negativo.
app.research.budget.safety-margin=${RESEARCH_BUDGET_SAFETY_MARGIN:5000}
# Tope por llamada, para que una sola no consuma todo el presupuesto.
app.research.budget.max-per-call=${RESEARCH_BUDGET_MAX_PER_CALL:20000}
# Rondas de correccion del informe antes de aceptarlo con sus problemas.
app.research.max-review-rounds=${RESEARCH_MAX_REVIEW_ROUNDS:2}
# Pasos maximos por tarea de investigacion.
app.research.max-steps-per-task=${RESEARCH_MAX_STEPS_PER_TASK:12}
# Tope de tareas nuevas que un agente puede proponer por ronda.
app.research.max-new-tasks-per-round=${RESEARCH_MAX_NEW_TASKS:3}
