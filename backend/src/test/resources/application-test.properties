# Perfil de pruebas: usa el contenedor de Testcontainers para PostgreSQL.
# Los tests de dominio no necesitan base de datos y corren sin Docker.
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# El LLM se sustituye por dobles de prueba: Ollama no debe iniciar
# ni descargar modelos durante los tests.
spring.ai.ollama.init.pull-model-strategy=never
app.llm.retry.max-attempts=2
app.llm.retry.initial-backoff=10ms

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
logging.level.com.abegomez.research=DEBUG
